<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="K-QOnline จองและติดตามคิว"><title>K-QOnline</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="public-queue.css"><link rel="stylesheet" href="ticket.css"></head>
<body><div class="public-shell"><header class="public-head"><div class="public-brand"><b>KQ</b><div><strong>K-QOnline</strong><span>จองและติดตามคิวออนไลน์</span></div></div><a href="status.html" style="color:#fff">คิวของฉัน</a></header><main class="public-main">
  <section id="bookingPanel" class="card lookup"><span class="eyebrow">ONLINE BOOKING</span><h1>จองคิวออนไลน์</h1><p>เลือกช่วงเวลาที่สะดวกและนำ QR ไปเช็กอินที่ Kiosk เมื่อมาถึง</p><form id="bookingForm"><label class="field">วันที่เข้ารับบริการ<input id="bookingDate" type="date" required></label><label class="field">Slot ที่เปิดรับ<select id="onlineSlot" required></select></label><label class="field">ชื่อผู้รับบริการ<input id="onlineName" autocomplete="name" required></label><label class="field">เบอร์โทรศัพท์<input id="onlinePhone" inputmode="tel" autocomplete="tel" required></label><button class="primary wide">ยืนยันการจอง</button></form><div id="bookingError" class="error hidden"></div></section>
  <section id="bookingResult" class="card hidden"><div class="ticket"><span class="eyebrow">BOOKING CONFIRMED</span><h1>จองคิวเรียบร้อยแล้ว</h1><p id="bookingReference"></p><img id="bookingQr" class="ticket-qr" alt="QR สำหรับเช็กอินและติดตามสถานะ"><p>นำ QR นี้ไปสแกนยืนยันที่ Kiosk เมื่อถึงสถานที่</p><a id="bookingStatusLink" href="#">ดูสถานะการจอง</a><p><code id="bookingToken"></code></p></div><div class="actions"><button id="saveBooking" class="primary">บันทึก QR</button><button id="bookAgain" class="secondary">จองรายการใหม่</button></div></section>
</main></div><script src="qrcode.js"></script><script src="online.js"></script></body></html>
