server {
    listen 127.0.0.1:8088;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/k-qcenter-public.access.log;
    error_log /var/log/nginx/k-qcenter-public.error.log;

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/k-qcenter/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.5-fpm-kqcenter.sock;
    }
}

server {
    listen 127.0.0.1:8089;
    server_name _;
    server_tokens off;
    root /var/www/k-qcenter;
    index index.html;
    client_max_body_size 2m;

    access_log /var/log/nginx/k-qcenter-private.access.log;
    error_log /var/log/nginx/k-qcenter-private.error.log;

    location ~ /\. { deny all; }
    location ^~ /data/ { deny all; }
    location ^~ /docs/ { deny all; }
    location ^~ /deploy/ { deny all; }
    location ^~ /public/ { deny all; }
    location = /api/bootstrap.php { deny all; }
    location = /api/schema-mariadb.sql { deny all; }

    # Separate PWA scope for K-QOnline during Tailnet testing. All requests in
    # this path pass through the public allowlist gateway on port 8088.
    location = /online { return 302 /online/; }
    location ^~ /online/ {
        proxy_pass http://127.0.0.1:8088/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / { try_files $uri $uri/ /index.html; }

    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /api/index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/k-qcenter/api/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.5-fpm-kqcenter.sock;
    }

    location ~ \.php$ { return 404; }
}

