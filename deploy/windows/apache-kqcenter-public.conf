Listen 127.0.0.1:8088

<VirtualHost 127.0.0.1:8088>
    ServerName k-qcenter-public.local
    DocumentRoot "C:/xampp/htdocs/k-qcenter/public"

    <Directory "C:/xampp/htdocs/k-qcenter/public">
        Options -Indexes -Includes -ExecCGI
        AllowOverride FileInfo Limit
        Require local
    </Directory>

    ErrorLog "logs/k-qcenter-public-error.log"
    CustomLog "logs/k-qcenter-public-access.log" combined
</VirtualHost>

